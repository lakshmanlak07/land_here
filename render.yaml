# ─────────────────────────────────────────────────────────────────────────────
# STAGING blueprint. NOT production.
#
# Cut from the tag v0.1.0-rc.5. Every resource name carries a "-staging" suffix
# so this can never collide with, or be mistaken for, the production stack that
# render.yaml on the release branch will create.
#
# ENV is deliberately still "production": that is what exercises the fail-closed
# startup guards and disables /docs, both of which this deployment exists to
# verify. It does NOT mean this is a production environment.
#
# Nothing real should ever point at this stack: no store listing, no hosted
# legal document, no App Store or Play Console notification URL.
# ─────────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: landhere-api-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Pinned explicitly rather than relying on Render's default, so the monthly
    # cost of applying this blueprint is deterministic and reviewable in the
    # file. Starter is $7/month (512 MB, 0.5 CPU) as listed on render.com/pricing
    # on 2026-08-17. The Free instance type is deliberately not used: it spins
    # down when idle, and the first request after a sleep is slow enough to be a
    # problem for a mobile client and for an App Review reviewer.
    # Starter, not Free: a Free instance spins down when idle, and the first
    # request after a sleep would make the /health/ready check and the
    # rate-limit verification slow and flaky — the two things this stack exists
    # to test.
    plan: starter
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: landhere-db-staging
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Set this to the real origin(s) after the first deploy, e.g.
      # https://api.landhere.app — production REFUSES to boot on "*" or empty.
      - key: CORS_ALLOW_ORIGINS
        sync: false
      # Production fails closed on a placeholder SECRET_KEY, wildcard CORS, a
      # localhost DATABASE_URL, or TRUST_PROXY_HEADERS without hops
      # (app/core/config.py). A crashed deploy is recoverable; a live service
      # with wildcard CORS is not.
      - key: ENV
        value: production
      # Shared rate-limit backend, from the Key Value instance declared below.
      # Without it start.sh forces --workers 1, because in-memory limits do not
      # coordinate across processes and N workers would multiply every published
      # limit by N.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: landhere-cache-staging
          property: connectionString
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_MINUTES
        value: "43200"
      # Server-side Unsplash key for GET /images/city. Never an EXPO_PUBLIC_ var.
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      # Password-reset email via Resend. Secret: set in the Render dashboard only.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PASSWORD_RESET_URL
        value: landhere://reset-password

      # ── LandHere Pro / App Store verification ─────────────────────────────
      # None of these is a secret; see .env.example. No Apple private key,
      # .p8, or shared secret is used anywhere in this project.
      - key: APPLE_BUNDLE_ID
        value: com.landhere.app
      - key: APPLE_PRO_PRODUCT_ID
        value: com.landhere.app.pro
      # Numeric App Store Connect app id. REQUIRED for Production verification —
      # without it /purchases/verify returns 503 and nobody can buy anything.
      # Unknown until the App Store Connect record exists.
      - key: APPLE_APP_APPLE_ID
        sync: false
      # Baked into the image by the Dockerfile from vendor/apple-root-ca/.
      - key: APPLE_ROOT_CA_DIR
        value: /app/vendor/apple-root-ca
      # TRUE only while testing through TestFlight (sandbox purchases).
      # MUST be false for the public release.
      - key: APPLE_ACCEPT_SANDBOX
        sync: false
      - key: APPLE_ENABLE_ONLINE_CHECKS
        value: "true"

      # ── LandHere Pro on Google Play ───────────────────────────────────────
      # Unlike the Apple block above, TWO of these are real secrets. Both are
      # sync: false so they are entered in the dashboard and never live in this
      # file or in git.
      - key: GOOGLE_PLAY_PACKAGE_NAME
        value: com.landhere.app
      - key: GOOGLE_PLAY_PRO_PRODUCT_ID
        value: com.landhere.app.pro
      # SECRET: service-account JSON, one line. Contains a private key.
      # Empty => Android verification returns 503 and nobody can buy on Play.
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        sync: false
      # Pub/Sub push OIDC. NOT secrets: an audience and an identifier. The
      # security is Google's signature over the token.
      - key: GOOGLE_PUBSUB_AUDIENCE
        sync: false
      - key: GOOGLE_PUBSUB_SERVICE_ACCOUNT_EMAIL
        sync: false
      # TRUE only while testing through Play internal testing.
      # MUST be false for the public release.
      - key: GOOGLE_ACCEPT_TEST_PURCHASES
        sync: false

  # Shared rate-limit backend. Required to run more than one web worker.
  - type: keyvalue
    name: landhere-cache-staging
    # Free is enough here: rate limiting is ephemeral sorted sets, so the 25 MB
    # and the lack of persistence cost us nothing. Production should use a paid
    # tier for the connection limit, not for durability.
    plan: free
    ipAllowList: []   # internal connections only — never expose this publicly

databases:
  - name: landhere-db-staging
    databaseName: landhere_staging
    # Free is correct for STAGING and wrong for production. Render deletes free
    # PostgreSQL instances after a fixed trial window (~30 days) — which is a
    # feature here, since this stack is disposable, and a data-loss event in
    # production. The production blueprint keeps basic-256mb for that reason.
    #
    # ⚠️ Confirm the current plan names and the trial window on Render's pricing
    # page before applying; this file cannot keep itself up to date.
    plan: free
