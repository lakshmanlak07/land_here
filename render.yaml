services:
  - type: web
    name: landhere-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: landhere-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Set this to the real Render URL after the first deploy, e.g.
      # https://landhere-api.onrender.com  — do NOT leave it as "*" in production.
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_MINUTES
        value: "43200"
    healthCheckPath: /

databases:
  - name: landhere-db
    plan: free
    databaseName: landhere
