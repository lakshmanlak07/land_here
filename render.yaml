# ─────────────────────────────────────────────────────────────────────────────
# PRODUCTION blueprint for LandHere (free launch).
# Applying this creates PAID resources. Prices from render.com/pricing,
# read 2026-10-14 (Hobby workspace, $0):
#   landhere-api  web service, Starter (512 MB, 0.5 CPU) ........ $7/month
#   landhere-db   PostgreSQL, Basic-256mb (1 GB SSD incl.) ...... $6/month
#                 extra storage $0.30/GB/month; PITR window 3 days on Hobby
#   Estimated total ≈ $13/month + storage/bandwidth overages.
# No Redis: start.sh forces a single worker without REDIS_URL, so rate limits
# stay exact. Add a Key Value instance ($10/month) before scaling workers.
#
# Region: Singapore — closest Render region to the India-based audience.
# Change BOTH regions together if you pick another one (the database must be
# in the same region as the service for the internal connection string).
#
# Secrets marked `sync: false` are entered in the Render dashboard only; never
# commit them. The staging stack is in render.staging.yaml.
# ─────────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: landhere-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    healthCheckPath: /health/ready
    autoDeploy: false   # deploy deliberately from the dashboard, not on every push
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: landhere-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # No browser client exists; native apps are not subject to CORS. Production
      # boot rejects "*" and empty, so this names the only web origin we serve
      # (the GitHub Pages legal/support site). Requests are not credentialed.
      - key: CORS_ALLOW_ORIGINS
        value: https://lakshmanlak07.github.io
      # Render terminates TLS in one proxy hop in front of the container.
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_MINUTES
        value: "43200"
      - key: PAYWALL_ENABLED
        value: "false"
      - key: PURCHASES_ENABLED
        value: "false"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      # Countries, journeys and the 267-school ranking dataset are loaded by
      # start.sh on every boot (idempotent upserts from the repo).
      - key: LOAD_REFERENCE_DATA
        value: "true"
      # Password-reset email (Resend). Secrets: dashboard only.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PASSWORD_RESET_URL
        value: landhere://reset-password
      # City photos (server-side Unsplash lookup). Optional; 503 when unset.
      - key: UNSPLASH_ACCESS_KEY
        sync: false

databases:
  - name: landhere-db
    plan: basic-256mb
    region: singapore
    databaseName: landhere
    user: landhere
    ipAllowList: []   # internal connections only
