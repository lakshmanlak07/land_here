services:
  - type: web
    name: landhere-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: landhere-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Set this to the real Render URL after the first deploy, e.g.
      # https://landhere-api.onrender.com  — do NOT leave it as "*" in production.
      - key: CORS_ALLOW_ORIGINS
        sync: false
      # Required. Production refuses to boot with ENV=production unless CORS,
      # DATABASE_URL, and SECRET_KEY are real values (app/core/config.py).
      - key: ENV
        value: production
      # Shared rate-limit backend. Without it the app runs a SINGLE worker
      # (start.sh) because in-memory limits don't coordinate across processes.
      # Provision: Render Dashboard → New → Key Value, then paste its internal
      # connection URL here.
      - key: REDIS_URL
        sync: false
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_MINUTES
        value: "43200"
      # Server-side Unsplash key for GET /images/city. Never an EXPO_PUBLIC_ var.
      - key: UNSPLASH_ACCESS_KEY
        sync: false
    healthCheckPath: /health/ready

databases:
  - name: landhere-db
    plan: free
    databaseName: landhere
