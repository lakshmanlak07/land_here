name: CI

on:
  pull_request:
  push:
    branches: [main, "launch/**", "release/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: land_here
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI-only throwaway credentials for the service container above.
      LANDHERE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/land_here
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests (SQLite suite + PostgreSQL integration)
        run: pytest -q
      - name: Migrations, seed and dataset load on a disposable database
        run: python scripts/check_migrations.py postgresql://postgres:postgres@localhost:5432/postgres
      - name: Dependency audit (informational)
        continue-on-error: true
        run: pip install pip-audit && pip-audit -r requirements.txt

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npx eslint .
      - name: Policy, session-isolation and sync checks
        run: npm run check
      - name: Unit tests
        run: npm test --if-present
      - name: Expo doctor
        run: npx expo-doctor
